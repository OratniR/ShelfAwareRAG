[project]
name = "shelfawarerag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "chromadb>=1.2.0",
    "faiss-cpu>=1.12.0",
    "fastapi>=0.119.0",
    "httpx>=0.28.1",
    "langchain>=1.0.0",
    "llama-cpp-python[server]>=0.3.16",
    "notion-client>=2.6.0",
    "openai>=2.5.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "sentence-transformers>=5.1.1",
    "streamlit>=1.52.2",
    "torch>=2.9.0",
    "uvicorn>=0.38.0",
]
extra-index-url = "https://download.pytorch.org/whl/cpu"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests (slow, requires env)",
    "e2e: marks tests as end-to-end tests (requires running server)",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Ignore all rules in prompt file
"src/shelf_aware/prompts.py" = ["ALL"]
