services:
  # Service 1: Our RAG API
  rag-api:
    build:
      context: .
      target: api
    container_name: rag-api
    ports:
      - "8000:8000"  # Map your Pi's port 8000 to the container's port 8000
    volumes:
      # Mount the data directory for ChromaDB and logs
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./src:/app/src
    # This is the magic: it tells our API to use the LLM service
    environment:
      - LLM_API_BASE=http://llm-server:8001/v1
      - NOTION_API_KEY=${NOTION_API_KEY}           # Reads from .env or host env
      - NOTION_DATASOURCE_ID=${NOTION_DATASOURCE_ID}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - PYTHONPATH=/app/src
    depends_on:
      llm-server:
        condition: service_healthy  # モデルロード完了を待つ
    restart: unless-stopped

  # Service 2: The LLM Server
  llm-server:
    build:
      context: .
      target: llm
    container_name: llm-server
    command:
      - "uv"
      - "run"
      - "python"
      - "-m"
      - "llama_cpp.server"
      - "--model"
      - "/models/${MODEL_FILENAME}"
      - "--n_gpu_layers"
      - "0"
      - "--n_threads"
      - "4"
      - "--n_batch"
      - "256"
      - "--n_ctx"
      - "2048"
      - "--type_k"      # KV Cache量子化（Key）
      - "2"
      - "--type_v"      # KV Cache量子化（Value）
      - "2"
      - "--flash_attn"  # Flash Attention
      - "true"
      - "--cache"
      - "false"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8001"
    volumes:
      # Mount our local model file into the container
    - ./data/models:/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # We DO NOT expose any ports. This server is only accessible
    # from the private network that Docker creates for our app.

  # Service 3: The Streamlit Dashboard
  dashboard:
    build:
      context: .
      target: dashboard
    container_name: dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app/src
    command: ["uv", "run", "streamlit", "run", "src/shelf_aware/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - rag-api
    restart: unless-stopped

  # Service 4: Benchmark Runner (手動実行用)
  # 使い方:
  #   docker compose run --rm benchmark                        # 通常実行
  #   docker compose run --rm -e UPDATE_BASELINE=1 benchmark   # ベースライン更新
  benchmark:
    build:
      context: .
      target: benchmark
    container_name: benchmark
    volumes:
      - ./tests/benchmark:/app/tests/benchmark  # baseline.json の永続化
      - ./src:/app/src
    environment:
      - LLM_API_BASE=http://llm-server:8001/v1
      - LLM_MODEL=${LLM_MODEL:-gemma-2-2b-jpn-it-q2km.gguf}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - PYTHONPATH=/app/src
    depends_on:
      llm-server:
        condition: service_healthy
    profiles:
      - benchmark  # docker compose up では起動しない
