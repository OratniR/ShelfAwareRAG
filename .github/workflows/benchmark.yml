name: Model Benchmark

on:
  push:
    branches: [compare-models]

jobs:
  food-classification:
    name: Food Classification Benchmark
    runs-on: self-hosted  # Raspberry Pi 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start LLM server
        run: docker compose up -d llm-server

      - name: Wait for LLM server to be healthy
        run: |
          echo "⏳ Waiting for LLM server to load model..."
          timeout=300  # 最大5分待機
          elapsed=0
          until curl -sf http://localhost:8001/v1/models > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "❌ LLM server did not become healthy in ${timeout}s"
              docker compose logs llm-server --tail=30
              exit 1
            fi
            sleep 10
            elapsed=$((elapsed + 10))
            echo "  ... ${elapsed}s elapsed"
          done
          echo "✅ LLM server is ready"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra api --dev

      - name: Run food classification benchmark
        env:
          LLM_API_BASE: http://localhost:8001/v1
        run: uv run pytest tests/benchmark/ -v -s -m benchmark

      - name: Stop LLM server
        if: always()
        run: docker compose down llm-server
